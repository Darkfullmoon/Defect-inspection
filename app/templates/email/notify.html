<!doctype html>
<html lang="th"><body style="margin:0;padding:24px;background:#eef1fb;font-family:Tahoma,'Sarabun',sans-serif;color:#1f2937">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="center">
<table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(30,58,138,.12)">
  <tr><td style="background:linear-gradient(135deg,#1e3a8a,#4c1d95);padding:20px 26px;color:#fff">
    <div style="font-size:13px;opacity:.8">Defect Management System · Home</div>
    <div style="font-size:19px;font-weight:bold;margin-top:4px">{{ title }}</div>
  </td></tr>
  <tr><td style="padding:22px 26px;font-size:15px;line-height:1.7">
    <p style="margin:0 0 12px">เรียน คุณ{{ user.full_name or user.username }}</p>
    <div style="white-space:pre-line;background:{{ '#fef2f2' if kind == 'ncr' else '#f3f4f6' }};border-left:4px solid {{ '#dc2626' if kind == 'ncr' else '#4f46e5' }};padding:12px 14px;border-radius:8px">{{ body }}</div>
    <p style="margin:22px 0 4px"><a href="{{ url }}" style="display:inline-block;background:#4f46e5;color:#fff;text-decoration:none;padding:11px 22px;border-radius:10px;font-weight:bold">เปิดดูในระบบ</a></p>
  </td></tr>
  <tr><td style="padding:14px 26px;background:#f9fafb;color:#6b7280;font-size:12px">อีเมลนี้ส่งอัตโนมัติจากระบบ กรุณาอย่าตอบกลับ</td></tr>
</table></td></tr></table>
</body></html>
