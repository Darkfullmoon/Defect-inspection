<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  {% include "_thsarabun.html" %}
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f7; font-family: "THSarabunPSK", sans-serif; color: #111827; font-size: 16pt; line-height: 1.25; }
    .bar { position: sticky; top: 0; display: flex; gap: 8px; justify-content: center; padding: 12px; background: #ffffff; border-bottom: 1px solid #dbe3ef; z-index: 5; }
    .bar button, .bar a { font: inherit; padding: 8px 18px; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; color: #1e3a8a; text-decoration: none; cursor: pointer; }
    .bar button.primary { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
    .page { width: 210mm; min-height: 297mm; margin: 18px auto; background: #fff; padding: 14mm 14mm; box-shadow: 0 1px 3px rgba(15,23,42,.12); }
    @media (max-width: 820px) { .page { width: auto; min-height: 0; margin: 10px; padding: 18px; } }
    h1 { font-size: 22pt; margin: 0; line-height: 1.1; }
    h2 { font-size: 18pt; margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #1e3a8a; color: #1e3a8a; }
    .head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px double #1e3a8a; padding-bottom: 10px; margin-bottom: 10px; }
    .head .org { font-size: 14pt; color: #4b5563; }
    .docno { text-align: right; }
    .docno b { font-size: 20pt; color: #1e3a8a; }
    table.kv { width: 100%; border-collapse: collapse; }
    table.kv td { border: 1px solid #d1d5db; padding: 4px 9px; vertical-align: top; }
    table.kv td.k { width: 22%; background: #f3f4f6; font-weight: 600; }
    table.list { width: 100%; border-collapse: collapse; font-size: 14pt; }
    table.list th { background: #1e3a8a; color: #fff; padding: 6px; font-weight: 500; text-align: left; }
    table.list td { border-bottom: 1px solid #e5e7eb; padding: 6px; vertical-align: top; }
    table.list tr:nth-child(even) td { background: #f9fafb; }
    .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photos img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border: 1px solid #d1d5db; border-radius: 4px; }
    .tag { display: inline-block; padding: 0 10px; border-radius: 99px; font-size: 14pt; font-weight: 600; border: 1px solid; }
    .t-closed { color: #047857; border-color: #6ee7b7; background: #ecfdf5; }
    .t-open, .t-progress { color: #b45309; border-color: #fcd34d; background: #fffbeb; }
    .t-rework { color: #c2410c; border-color: #fdba74; background: #fff7ed; }
    .t-submitted { color: #0369a1; border-color: #7dd3fc; background: #f0f9ff; }
    .t-ncr { color: #b91c1c; border-color: #fca5a5; background: #fef2f2; }
    .sign { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 34px; text-align: center; font-size: 15pt; }
    .sign .line { border-bottom: 1px dotted #6b7280; height: 44px; margin-bottom: 6px; }
    .muted { color: #6b7280; }
    .box { border: 1px solid #d1d5db; border-radius: 6px; padding: 10px 12px; min-height: 60px; white-space: pre-line; }
    .avoid { break-inside: avoid; }
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; }
      .bar { display: none; }
      .page { margin: 0; padding: 0; width: auto; min-height: 0; box-shadow: none; }
      h2 { break-after: avoid; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a href="javascript:history.back()">← กลับ</a>
    <button class="primary" onclick="window.print()">พิมพ์ / บันทึกเป็น PDF</button>
  </div>
  <div class="page">{% block page %}{% endblock %}</div>
  {% if request.args.get('auto') == '1' %}<script>window.addEventListener("load", () => setTimeout(() => window.print(), 400));</script>{% endif %}
</body>
</html>
