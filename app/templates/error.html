{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block content %}
<div class="min-h-[60vh] grid place-items-center">
  <div class="glass p-8 text-center max-w-md">
    <div class="text-6xl font-bold" style="background:linear-gradient(135deg,#5b8cff,#8b5cf6);-webkit-background-clip:text;color:transparent">{{ code }}</div>
    <p class="mt-3 text-lg">{{ msg }}</p>
    {% if detail %}<p class="muted text-sm mt-1">{{ detail }}</p>{% endif %}
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-6"><i data-lucide="house"></i>กลับหน้าหลัก</a>
  </div>
</div>
{% endblock %}
